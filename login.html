<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>登录/注册 | 元启新思</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600;700;800&display=swap"
        rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', 'Segoe UI', system-ui, sans-serif;
            background: linear-gradient(135deg, #FFFFFF 0%, #FFF5F2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }

        .login-container {
            background: #FFFFFF;
            border-radius: 48px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.15);
            width: 100%;
            max-width: 480px;
            padding: 2.5rem;
            border: 1px solid #FFE4DE;
            transition: 0.2s;
        }

        .logo {
            text-align: center;
            font-size: 1.8rem;
            font-weight: 800;
            background: linear-gradient(135deg, #C41E3A, #E67E22);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            margin-bottom: 2rem;
            text-decoration: none;
            display: inline-block;
            width: 100%;
        }

        .tab {
            display: flex;
            gap: 1rem;
            margin-bottom: 2rem;
            border-bottom: 1px solid #F0EFF2;
        }

        .tab-btn {
            flex: 1;
            background: none;
            border: none;
            padding: 0.75rem;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            color: #7E8299;
            transition: 0.2s;
        }

        .tab-btn.active {
            color: #C41E3A;
            border-bottom: 2px solid #C41E3A;
        }

        .form-group {
            margin-bottom: 1.2rem;
        }

        label {
            display: block;
            margin-bottom: 0.4rem;
            font-weight: 500;
            color: #2C2E3A;
        }

        input {
            width: 100%;
            padding: 0.8rem 1rem;
            border: 1px solid #E2E4E8;
            border-radius: 28px;
            font-size: 0.9rem;
            transition: 0.2s;
            font-family: inherit;
        }

        input:focus {
            outline: none;
            border-color: #C41E3A;
            box-shadow: 0 0 0 3px rgba(196, 30, 58, 0.1);
        }

        .btn-login {
            width: 100%;
            background: #C41E3A;
            color: white;
            border: none;
            padding: 0.8rem;
            border-radius: 40px;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            margin-top: 1rem;
            transition: 0.2s;
        }

        .btn-login:hover {
            background: #A0162E;
            transform: translateY(-2px);
        }

        .form-footer {
            text-align: center;
            margin-top: 1.5rem;
            font-size: 0.8rem;
            color: #7E8299;
        }

        .back-home {
            display: block;
            text-align: center;
            margin-top: 1.5rem;
            color: #C41E3A;
            text-decoration: none;
            font-weight: 500;
            transition: 0.2s;
        }

        .back-home:hover {
            transform: translateX(-4px);
        }
    </style>
</head>

<body>
    <div class="login-container">
        <a href="../../index.html" class="logo">元启新思</a>
        <div class="tab">
            <button class="tab-btn active" id="loginTab">登录</button>
            <button class="tab-btn" id="registerTab">注册</button>
        </div>
        <div id="loginForm">
            <div class="form-group">
                <label>手机号 / 邮箱</label>
                <input type="text" placeholder="请输入手机号或邮箱" id="loginAccount">
            </div>
            <div class="form-group">
                <label>密码</label>
                <input type="password" placeholder="请输入密码" id="loginPassword">
            </div>
            <button class="btn-login" id="doLogin">登录</button>
            <div class="form-footer">未注册用户请先注册</div>
        </div>
        <div id="registerForm" style="display:none;">
            <div class="form-group">
                <label>用户名</label>
                <input type="text" placeholder="请输入用户名" id="regName">
            </div>
            <div class="form-group">
                <label>手机号</label>
                <input type="text" placeholder="请输入手机号" id="regPhone">
            </div>
            <div class="form-group">
                <label>密码</label>
                <input type="password" placeholder="请设置密码" id="regPassword">
            </div>
            <button class="btn-login" id="doRegister">注册</button>
            <div class="form-footer">已有账号？直接登录</div>
        </div>
        <a href="index.html" class="back-home">← 返回模块首页</a>
    </div>
    <script>
        (function () {
            var loginTab = document.getElementById('loginTab');
            var registerTab = document.getElementById('registerTab');
            var loginForm = document.getElementById('loginForm');
            var registerForm = document.getElementById('registerForm');

            loginTab.addEventListener('click', function () {
                loginTab.classList.add('active');
                registerTab.classList.remove('active');
                loginForm.style.display = 'block';
                registerForm.style.display = 'none';
            });

            registerTab.addEventListener('click', function () {
                registerTab.classList.add('active');
                loginTab.classList.remove('active');
                registerForm.style.display = 'block';
                loginForm.style.display = 'none';
            });

            document.getElementById('doLogin').addEventListener('click', function () {
                var account = document.getElementById('loginAccount').value;
                if (!account) {
                    alert('请输入账号');
                    return;
                }
                alert('登录成功\n欢迎回来，即将跳转首页');
                window.location.href = 'index.html';
            });

            document.getElementById('doRegister').addEventListener('click', function () {
                var name = document.getElementById('regName').value;
                if (!name) {
                    alert('请输入用户名');
                    return;
                }
                alert('注册成功，请登录');
                loginTab.click();
            });
        })();
    </script>
</body>

</html>
